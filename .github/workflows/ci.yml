name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      # Type-checks with `astro check`, then builds.
      - run: npm run build
      - name: Flag leftover placeholder content
        run: |
          grep -rnE 'TODO|Placeholder|example\.com' src \
            | sed -E 's/^([^:]+):([0-9]+):(.*)$/::warning file=\1,line=\2::\3/' \
            || echo "No placeholders found"
