<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Add Photos</title>
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <main>
      <nav class="top">
        <a class="link" href="/">← Back to site</a>
        <form method="post" action="/admin/logout">
          <button class="link" type="submit">Sign out</button>
        </form>
      </nav>
      <h1>Add photos</h1>
      <form id="form">
        <label for="category" class="first">Category</label>
        <select id="category" required>
          <!--CATEGORIES-->
        </select>

        <label>Photos</label>
        <label class="pick">
          <input id="files" type="file" accept="image/*,.heic,.heif" multiple />
          <span id="pick-label">Choose photos</span>
        </label>
        <ul id="list"></ul>

        <button id="submit" type="submit">Upload</button>
        <progress id="progress" max="1" value="0" hidden></progress>
        <p id="status" role="status"></p>
        <p class="hint">
          New photos appear on the website about 5 minutes after uploading.
        </p>
      </form>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const list = $("list");
      const status = $("status");
      let picked = [];

      function setStatus(text, kind = "") {
        status.textContent = text;
        status.className = kind;
      }

      let nextId = 0;

      function updatePickLabel() {
        $("pick-label").textContent = picked.length
          ? "Add more photos"
          : "Choose photos";
      }

      // Each picked photo gets a row: thumbnail, "What is it?" and an X.
      function addPhoto(file) {
        const id = `name-${nextId++}`;
        const ready = shrink(file); // start preparing now; uploading waits for it
        ready.catch(() => {}); // reported when uploading

        const li = document.createElement("li");
        const img = document.createElement("img");
        img.src = URL.createObjectURL(file);
        img.alt = "";
        // Show the converted version (HEIC can't be previewed in most browsers).
        ready.then((blob) => {
          if (blob !== file) img.src = URL.createObjectURL(blob);
        });
        const box = document.createElement("div");
        const lab = document.createElement("label");
        lab.htmlFor = id;
        lab.textContent = "What is it?";
        const input = document.createElement("input");
        input.type = "text";
        input.id = id;
        input.required = true;
        input.placeholder = "e.g. Blue cable toque";
        box.append(lab, input);

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "remove";
        remove.textContent = "×";
        remove.setAttribute("aria-label", `Remove ${file.name}`);

        const item = { file, ready, input };
        remove.addEventListener("click", () => {
          picked = picked.filter((p) => p !== item);
          li.remove();
          updatePickLabel();
        });

        li.append(img, box, remove);
        list.append(li);
        picked.push(item);
      }

      $("files").addEventListener("change", (e) => {
        [...e.target.files].forEach(addPhoto);
        e.target.value = ""; // so the same photo can be picked again
        updatePickLabel();
        setStatus("");
      });

      // iPhone HEIC photos: most browsers can't read them, so load a decoder
      // only when one is picked.
      const HEIC_DECODER =
        "https://cdn.jsdelivr.net/npm/heic-to@1.6.7/dist/heic-to.js";
      let heicDecoder;
      const isHeicFile = (file) =>
        /^image\/hei[cf]/i.test(file.type) || /\.hei[cf]$/i.test(file.name);

      async function decode(file) {
        try {
          return await createImageBitmap(file);
        } catch (err) {
          if (!isHeicFile(file)) throw err;
          heicDecoder ??= import(HEIC_DECODER);
          const { heicTo } = await heicDecoder;
          return heicTo({ blob: file, type: "bitmap" });
        }
      }

      // Convert to JPEG and shrink big phone photos before uploading (this
      // also removes location data).
      async function shrink(file) {
        let bitmap;
        try {
          bitmap = await decode(file);
        } catch (err) {
          if (isHeicFile(file)) {
            throw new Error(`Couldn't read "${file.name}". Try another photo.`);
          }
          return file; // the server checks it and explains if it can't be used
        }
        try {
          const scale = Math.min(
            1,
            2400 / Math.max(bitmap.width, bitmap.height),
          );
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(bitmap.width * scale);
          canvas.height = Math.round(bitmap.height * scale);
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#fff"; // transparent PNGs get a white background
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
          const blob = await new Promise((r) =>
            canvas.toBlob(r, "image/jpeg", 0.85),
          );
          return blob ?? file;
        } catch {
          return file;
        }
      }

      $("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        if (picked.length === 0)
          return setStatus("Choose at least one photo.", "err");

        const button = $("submit");
        const progress = $("progress");
        button.disabled = true;
        setStatus("Getting photos ready…");

        const data = new FormData();
        data.append("category", $("category").value);
        try {
          for (const { file, ready, input } of picked) {
            data.append("photo", await ready, file.name);
            data.append("name", input.value);
          }
        } catch (err) {
          button.disabled = false;
          return setStatus(err.message, "err");
        }

        setStatus("Uploading…");
        progress.hidden = false;
        progress.value = 0;

        const xhr = new XMLHttpRequest();
        xhr.open("POST", "/admin/upload");
        xhr.upload.onprogress = (ev) => {
          if (ev.lengthComputable) progress.value = ev.loaded / ev.total;
        };
        xhr.onloadend = () => {
          button.disabled = false;
          progress.hidden = true;
          let body = {};
          try {
            body = JSON.parse(xhr.responseText);
          } catch {}
          if (xhr.status === 401) {
            location.href = "/admin/login";
            return;
          }
          if (xhr.status === 200) {
            const n = body.saved.length;
            setStatus(
              `Saved ${n} ${n === 1 ? "photo" : "photos"}! They'll be on the website in about 5 minutes.`,
              "ok",
            );
            picked = [];
            list.replaceChildren();
            updatePickLabel();
          } else {
            setStatus(
              body.error ??
                "Upload failed. Check your connection and try again.",
              "err",
            );
          }
        };
        xhr.send(data);
      });
    </script>
  </body>
</html>
